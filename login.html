<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login</title>

<style>

body{
display:flex;
justify-content:center;
align-items:center;
height:100vh;
font-family:Arial;
background:#2e8b57;
}

.box{

background:white;

padding:40px;

border-radius:20px;

width:300px;

text-align:center;
}

input{

width:100%;

padding:12px;

margin:10px 0;
}

button{

width:100%;

padding:12px;

background:#2e8b57;

color:white;

border:none;

cursor:pointer;
}

</style>
</head>
<body>

<div class="box">

<h1>Login</h1>

<input type="text" placeholder="Username">

<input type="password" placeholder="Password">

<button onclick="login()">
Login
</button>

</div>

<script>

function login(){

window.location.href = "index.html";

}

</script>

</body>
</html>
